name: "common"
title: "Common CI Docker Image"
description: |
  Contains: GCC, Clang, CMake, Ninja, ccache and all base OS libraries
packages:
  - clang
  - cmake
  - ninja
implicit_packages:
  - cuda
  - optix
  - glvnd
  - ccache
  - dts
  - sonar
  - conan
  - yq
docker_args:
  - ASWF_SYSTEM_CLANG_MAJOR_VERSION
  - ASWF_SYSTEM_LLVM_RPATH
  - ASWF_SYSTEM_OSMESA_DSO_VERSION
docker_from: ${ASWF_BASEOS_IMAGE}:${ASWF_CUDA_VERSION}-runtime-${ASWF_BASEOS_DISTRO}
docker_package_version: $CI_COMMON_VERSION
docker_commands: |
  USER root

  COPY ../scripts/common/install_cudadevel.sh /tmp/

  RUN /tmp/install_cudadevel.sh

  COPY scripts/common/install_yumpackages.sh /tmp/

  RUN /tmp/install_yumpackages.sh

  COPY scripts/common/install_opengl.sh /tmp/

  ARG ASWF_BASEOS_DISTRO
  ENV ASWF_BASEOS_DISTRO=${ASWF_BASEOS_DISTRO}
  RUN /tmp/install_opengl.sh

  ENV NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
  ENV NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:+$NVIDIA_DRIVER_CAPABILITIES,}graphics
  ENV PKG_CONFIG_PATH=/usr/local/lib/pkgconfig

  COPY scripts/common/install_optix.sh /tmp/

  RUN /tmp/install_optix.sh

  COPY scripts/common/install_yq.sh /tmp/

  RUN /tmp/install_yq.sh

  RUN mkdir /opt/aswf
  WORKDIR /opt/aswf

  ENV LD_LIBRARY_PATH=/usr/local/lib:/opt/rh/${ASWF_DTS_PREFIX}-${ASWF_DTS_VERSION}/root/usr/lib64:/opt/rh/${ASWF_DTS_PREFIX}-${ASWF_DTS_VERSION}/root/usr/lib:${LD_LIBRARY_PATH} \
      PATH=/usr/local/bin:/opt/rh/${ASWF_DTS_PREFIX}-${ASWF_DTS_VERSION}/root/usr/bin:/opt/app-root/src/bin:/opt/rh/${ASWF_DTS_PREFIX}-${ASWF_DTS_VERSION}/root/usr/bin/:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin \
      PERL5LIB=/opt/rh/rh-git218/root/usr/share/perl5/vendor_perl \
      MANPATH=/opt/rh/rh-git218/root/usr/share/man

  COPY scripts/common/install_sonar.sh \
      scripts/common/install_ccache.sh \
      scripts/common/install_dev_cmake.sh \
      /tmp/

  RUN export DOWNLOADS_DIR=/tmp/downloads && \
    mkdir /tmp/downloads && \
    /tmp/install_sonar.sh && \
    export PATH="${PATH}":/opt/aswfbuilder/bin && \
    /tmp/install_dev_cmake.sh && \
    /tmp/install_ccache.sh && \
    rm -rf /tmp/downloads && \
    rm -rf /opt/aswfbuilder

  COPY scripts/common/setup_aswfuser.sh /tmp/
  RUN /tmp/setup_aswfuser.sh

  ENV ASWF_CONAN_ROOT=/opt/conan

  COPY ../scripts/common/install_conan.sh /tmp/

  RUN --mount=type=cache,id=aswf-downloads,sharing=private,target=/tmp/downloads \
      /tmp/install_conan.sh

  COPY ../packages/conan/settings /opt/conan_home/.conan
  ENV ASWF_CONAN_HOME=/opt/conan_home
docker_post_commands: |
  # libOSMesa.so is dynamically linked against the system's own LLVM
  # (see ASWF_SYSTEM_CLANG_MAJOR_VERSION/ASWF_SYSTEM_LLVM_RPATH in
  # versions.yaml's rockylinuxN entries). LD_LIBRARY_PATH (set above to
  # include /usr/local/lib) is consulted before libOSMesa's own rpath, so if
  # our own Conan-built clang/llvm (just deployed to /usr/local by the
  # `conan install --deployer aswf_deploy` step above) happens to share the
  # system's LLVM major version -- and therefore the same libLLVM-<N>.so
  # soname -- libOSMesa.so can end up resolving its LLVM dependency against
  # our copy instead of the system one it was actually built against. That
  # causes libOSMesa's own LLVM target/CodeGen initialization to run
  # alongside anything else in the same process that also initializes LLVM
  # (e.g. a Conan package's own LLVM use), colliding over shared global LLVM
  # state (e.g. "LLVM ERROR: Option 'basic' already exists!"). Pin
  # libOSMesa's rpath to the system LLVM's actual location (an explicit
  # DT_RPATH, via --force-rpath, is consulted before LD_LIBRARY_PATH) so it
  # always resolves there regardless.
  RUN if [ "${ASWF_SYSTEM_CLANG_MAJOR_VERSION}" = "${ASWF_CLANG_MAJOR_VERSION}" ]; then \
        osmesa_lib=/usr/lib64/libOSMesa.so.${ASWF_SYSTEM_OSMESA_DSO_VERSION} && \
        test -f "${osmesa_lib}" && \
        patchelf --set-rpath "${ASWF_SYSTEM_CLANG_RPATH}" --force-rpath "${osmesa_lib}"; \
      fi
