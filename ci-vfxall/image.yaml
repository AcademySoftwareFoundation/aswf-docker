name: "vfxall"
title: "VFX All CI Docker Image"
description: |
  Contains: all supported VFX packages
packages:
  - cppunit
  - glew
  - gtest
  - libxcrypt     # No longer a dependency of cpython as of 3.13
  - log4cplus
  - qt
  - pyside
  - opensubdiv    # Dependency of USD once it becomes Conan package
  - partio        # Dependency of OSL once it becomes Conan package
  - alembic       # Dependency of USD once it becomes Conan package
  - imath
  - opencolorio
  - openexr
  - openfx
  - openimageio
  - opentimelineio
  - openusd
  - openvdb
  - materialx
  - osl
  - rawtoaces
  - moonray
implicit_packages:
  - numpy
  - vfxplatform
  - rez
docker_from: ${ASWF_ORG}/ci-common:${CI_COMMON_VERSION}-clang${ASWF_CLANG_MAJOR_VERSION}
docker_package_version: $ASWF_VFXPLATFORM_VERSION
docker_post_commands: |
  # Rez is built and installed from its official source release after the
  # Conan packages are deployed, so that install.py runs with the image
  # Python interpreter. It installs into its own ${ASWF_INSTALL_PREFIX}/rez
  # prefix: installed Rez trees carry absolute paths and must never be moved
  # after installation. See
  # https://rez.readthedocs.io/en/stable/installation.html
  # The same scripts/vfx/build_rez.sh is used by the ci-rez image.
  COPY scripts/vfx/build_rez.sh /tmp/

  RUN --mount=type=cache,id=aswf-downloads,sharing=private,target=/tmp/downloads \
      export DOWNLOADS_DIR=/tmp/downloads && \
      /tmp/build_rez.sh

  ENV PATH="${ASWF_INSTALL_PREFIX}/rez/bin/rez:${PATH}"
